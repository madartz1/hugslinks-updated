<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#071f3b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Open Your HUG · HUGSLinks</title>
  <link rel="manifest" href="/app/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/app/icon-192.png">
  <link rel="stylesheet" href="/anniversary.css">
  <script src="/app/open-hug.js" defer></script>
</head>
<body>
  <header class="brand"><a href="/app/">HUGSLinks<span> ♥</span></a></header>
  <main>
    <section class="panel centered">
      <h1 id="gift-heading" tabindex="-1">Open Your HUG</h1>
      <p id="gift-status" class="status" role="status"></p>
      <form id="paste-gift" hidden>
        <label>Card link<input id="pasted-link" type="url" required autocomplete="off" placeholder="Paste the link you received"></label>
        <button>Open Card</button>
      </form>
      <div id="full-gift" hidden></div>
      <div id="gift-library" hidden>
        <button id="save-gift" type="button">Save to My Cards</button>
        <a class="secondary link-button" href="/app/#saved">My Cards</a>
        <a class="secondary link-button" href="/anniversary-motion.html">Send this card again</a>
      </div>
    </section>
  </main>
</body>
</html>
