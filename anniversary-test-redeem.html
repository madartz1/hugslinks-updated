<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Anniversary HUGS Card | Test</title><style>body{font:17px system-ui;background:#f7f3ec;color:#071f3b;margin:0}main{max-width:620px;margin:35px auto;padding:25px;background:white;border-radius:22px}label{display:block;margin:18px 0 6px;font-weight:bold}input,textarea{box-sizing:border-box;width:100%;padding:13px;border:1px solid #aaa;border-radius:8px;font:inherit}button{margin-top:20px;background:#071f3b;color:white;border:0;border-radius:30px;padding:15px 25px;font:inherit}button:disabled{opacity:.5}#result{overflow-wrap:anywhere}</style></head><body><main><h1>Anniversary HUGS Card</h1><p><strong>TEST MODE ONLY</strong> · Complete your card after a successful $6.99 test payment.</p><form id="form"><label for="recipient">Recipient name</label><input id="recipient" maxlength="80" required><label for="sender">From</label><input id="sender" maxlength="80" required><label for="message">Your message</label><textarea id="message" maxlength="600" rows="5" required></textarea><button id="submit">Create my card</button></form><p id="result" role="status"></p></main><script>const form=document.querySelector('#form'),result=document.querySelector('#result'),button=document.querySelector('#submit');form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;result.textContent='Verifying payment…';try{const response=await fetch('/.netlify/functions/anniversary-test-fulfillment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:new URLSearchParams(location.search).get('session_id'),recipient:document.querySelector('#recipient').value,sender:document.querySelector('#sender').value,message:document.querySelector('#message').value})});const data=await response.json();if(!response.ok)throw Error(data.error||'Unable to create card');form.hidden=true;const a=document.createElement('a');a.href=data.card_url;a.textContent='Open your anniversary card';result.replaceChildren(document.createTextNode('Your card is ready. '),a)}catch(error){result.textContent=error.message;button.disabled=false}});</script></body></html>
