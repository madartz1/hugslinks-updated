<script>
  const button =
    document.getElementById("testButton");

  const result =
    document.getElementById("result");

  button.addEventListener(
    "click",
    async function () {

      button.disabled = true;

      result.textContent =
        "Uploading to R2...";

      try {

        const response =
          await fetch(
            "/.netlify/functions/overwrite-test-hug",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                order_id:
                  "HUG-TEST-MTTL0NE5-M4JUS4"
              })
            }
          );

        const text =
          await response.text();

        let data;

        try {
          data =
            JSON.parse(text);
        } catch {
          data = {
            raw_response: text
          };
        }

        result.textContent =
          JSON.stringify(
            data,
            null,
            2
          );

      } catch (error) {

        result.textContent =
          "ERROR: " +
          error.message;

      } finally {

        button.disabled = false;

      }

    }
  );
</script>
