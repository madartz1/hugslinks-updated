<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Test HUG Storage</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      padding: 30px 18px;
      background: #f8f5ee;
      color: #23374d;
      text-align: center;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 16px 22px;
      background: #0b2f59;
      color: white;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    pre {
      margin-top: 24px;
      padding: 18px;
      background: white;
      border-radius: 16px;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <h1>Test HUG R2 Storage</h1>

  <p>
    This temporary page tests storing the completed HUG video in Cloudflare R2.
  </p>

  <button id="testButton">
    Store Completed Test HUG
  </button>

  <pre id="result">
Waiting for test...
  </pre>

  <script>
    const button =
      document.getElementById("testButton");

    const result =
      document.getElementById("result");

    button.addEventListener(
      "click",
      async function () {

        button.disabled = true;

        result.textContent =
          "Uploading to R2...";

        try {

          const response =
            await fetch(
              "/.netlify/functions/store-hug-video",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  order_id:
                    "HUG-TEST-MTTL0NE5-M4JUS4"
                })
              }
            );

          const text =
            await response.text();

          let data;

          try {
            data =
              JSON.parse(text);
          } catch {
            data = {
              raw_response: text
            };
          }

          result.textContent =
            JSON.stringify(
              data,
              null,
              2
            );

        } catch (error) {

          result.textContent =
            "ERROR: " +
            error.message;

        } finally {

          button.disabled = false;

        }

      }
    );
  </script>

</body>
</html>
