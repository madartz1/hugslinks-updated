<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | HL Studio</title></head><body><main><h1>HL Studio password reset</h1><form id="reset"><label>New password<input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><label>Confirm password<input id="confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><button>Reset password</button></form><p id="status" role="status"></p><a href="/studio/">Return to Studio</a></main><script>const p=new URLSearchParams(location.search),token=p.get('token');history.replaceState({},'',location.pathname);const form=document.getElementById('reset'),status=document.getElementById('status');if(!token){form.hidden=true;status.textContent='Invalid reset link'}form.addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('password').value;if(password!==document.getElementById('confirm').value){status.textContent='Passwords do not match';return}try{const r=await fetch('/.netlify/functions/hl-studio-auth?action=reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})});const data=await r.json();if(!r.ok)throw Error(data.error);status.textContent=data.message;form.hidden=true}catch(error){status.textContent=error.message}})</script></body></html>
