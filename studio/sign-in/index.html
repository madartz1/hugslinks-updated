<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure sign-in | HL Studio</title><style>:root{font-family:system-ui,-apple-system,sans-serif;background:#f1f6fa;color:#102b45}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:white;border:1px solid #d9e5ed;border-radius:18px;padding:30px;max-width:500px;width:100%;box-shadow:0 8px 24px #102b4512}a{color:#087bbd}h1{margin-top:0}p{line-height:1.5}</style></head><body><main class="card"><h1 style="display:flex;align-items:center;gap:12px"><img src="/assets/HUGS_Header_Logo_Transparent.png" alt="HUGSLinks house-and-heart logo" style="width:55px;height:55px;object-fit:contain">HUGSLinks Studio</h1><h2>Secure member sign-in</h2><p id="status" role="status" aria-live="polite">Verifying your sign-in link…</p><p><a href="/studio/">Return to HL Studio</a></p></main><script>(async()=>{const status=document.getElementById('status'),params=new URLSearchParams(location.search),token=params.get('token'),returnTo=(params.get('returnTo')==='/studio/pilot-admin/'||params.get('returnTo')==='/studio/pilot-admin/sign-in/')?'/studio/pilot-admin/sign-in/':'/studio/';history.replaceState({},'',location.pathname);if(!token||!/^[a-f0-9]{64}$/.test(token)){status.textContent='Invalid sign-in link. Request a new link from HL Studio.';return}try{const response=await fetch('/.netlify/functions/hl-studio-auth?action=verify',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({token})});const data=await response.json();if(!response.ok)throw Error(data.error||'Unable to sign in');status.textContent='Signed in successfully. Opening your dashboard…';location.replace(returnTo)}catch(e){status.textContent=e.message+' Please request a new sign-in link.'}})();</script></body></html>
