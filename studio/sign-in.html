<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in | HUGSLinks Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#081725;color:#e9f7ff;font:16px/1.6 system-ui,-apple-system,sans-serif;display:grid;min-height:100vh;place-items:center;padding:25px}.box{width:min(440px,100%);background:#122d44;border:1px solid #345f78;border-radius:20px;padding:28px}h1{margin:0 0 10px;font-size:32px}p{color:#c4d9e7}label{display:block;font-weight:700;margin:18px 0 8px}input,button{width:100%;padding:13px 15px;border-radius:12px;font:inherit}input{background:#eaf7ff;color:#082238;border:2px solid #8ac9ec}button{border:0;background:#1680c5;color:white;font-weight:800;margin-top:15px;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}a{color:#8dd8ff}#status{min-height:48px}#verify{display:none}:focus-visible{outline:3px solid #a3dfff;outline-offset:3px}</style></head><body><main class="box"><a href="/">HUGSLinks</a><h1>Sign in to Studio</h1><p>Enter your email to receive a six-digit HUGSLinks Studio access code.</p><form id="request"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" maxlength="254" required><button>Send my code</button></form><form id="verify"><label for="code">Six-digit code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button>Sign in to my Studio</button></form><p id="status" role="status" aria-live="polite"></p><p><a href="/studio/plans.html">View HUGSLinks Studio plans</a></p></main><script>
const status=document.getElementById('status');async function submit(path,payload){const r=await fetch('/.netlify/functions/'+path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.error||'Service unavailable');return d}
document.getElementById('request').addEventListener('submit',async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;status.textContent='Sending your code…';try{const d=await submit('hl-studio-request-code',{email:document.getElementById('email').value});status.textContent=d.message;document.getElementById('verify').style.display='block'}catch(err){status.textContent=err.message}finally{b.disabled=false}});
document.getElementById('verify').addEventListener('submit',async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;status.textContent='Verifying…';try{await submit('hl-studio-verify-code',{email:document.getElementById('email').value,code:document.getElementById('code').value});location.assign('/studio/account.html')}catch(err){status.textContent=err.message}finally{b.disabled=false}});
</script></body></html>
