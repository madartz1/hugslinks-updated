<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUGS Studio · Pilot Review</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#102b45;background:#f1f6fa}*{box-sizing:border-box}body{margin:0}header{background:#102b45;color:#fff;padding:20px}header a{color:#b4e3ff}main{max-width:960px;margin:auto;padding:24px 18px}button,select{font:inherit;padding:9px;border:1px solid #c4d6e3;border-radius:8px}button{background:#087bbd;color:#fff;font-weight:700;cursor:pointer}article{background:#fff;border:1px solid #d9e5ed;border-radius:14px;padding:18px;margin:16px 0;overflow-wrap:anywhere}dt{font-weight:800;margin-top:12px}dd{margin:4px 0 0;white-space:pre-wrap}p{line-height:1.5}a{color:#087bbd}</style></head><body><header><a href="/studio/">← HL Studio</a> · Private pilot applications</header><main><h1>Managed production requests</h1><p>Preview-only admin review. Sign in with the configured HL Studio pilot administrator account. Do not share this page as a customer application link.</p><button id="refresh">Refresh requests</button> <button id="demo">Create sample restaurant request</button><p id="message" role="status"></p><div id="list"></div></main><script>
const message=document.getElementById('message'),list=document.getElementById('list');
async function call(action,body){const response=await fetch('/.netlify/functions/hl-studio-pilot?action='+action,{credentials:'same-origin',...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});const data=await response.json();if(!response.ok)throw Error(data.error||'Unable to load');return data}
async function load(){message.textContent='Loading…';list.replaceChildren();try{const data=await call('list');message.textContent=data.requests.length+' applications';for(const item of data.requests){const article=document.createElement('article');const title=document.createElement('h2');title.textContent=item.business_name+' · '+item.contact_name;article.append(title);const small=document.createElement('p');small.textContent='Submitted '+new Date(item.created_at).toLocaleString()+' · '+item.service+' · '+item.duration+' seconds';article.append(small);for(const [label,value] of [['Email',item.email],['Business type',item.business_type],['Goal',item.objective],['Audience',item.audience],['Budget',item.budget],['Preferred date',item.deadline],['Notes',item.notes],['Quote status',item.quote_status],['Quote scope',item.quote_scope],['Preview URL',item.preview_url],['Delivery URL',item.delivery_url]]){if(!value)continue;const dl=document.createElement('dl'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;dl.append(dt,dd);article.append(dl)}if(item.assets_url){const a=document.createElement('a');a.href=item.assets_url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Open supplied asset link ↗';article.append(a)}const row=document.createElement('p');const label=document.createElement('label');label.textContent='Application status: ';const select=document.createElement('select');for(const value of ['new','reviewing','accepted','declined','delivered']){const opt=document.createElement('option');opt.value=value;opt.textContent=value;if(value===item.status)opt.selected=true;select.append(opt)}const save=document.createElement('button');save.textContent='Save status';save.addEventListener('click',async()=>{save.disabled=true;try{await call('status',{id:item.id,status:select.value});message.textContent='Saved status for '+item.business_name}catch(e){message.textContent=e.message}finally{save.disabled=false}});label.append(select);row.append(label,document.createTextNode(' '),save);article.append(row);
const quoteBox=document.createElement('section');const quoteTitle=document.createElement('h3');quoteTitle.textContent='Internal quote draft (not sent to customer)';quoteBox.append(quoteTitle);
const amount=document.createElement('input');amount.type='number';amount.min='0';amount.step='0.01';amount.placeholder='Quote amount in USD';amount.value=item.quote_amount_cents==null?'':(item.quote_amount_cents/100).toFixed(2);amount.setAttribute('aria-label','Quote amount in dollars');
const scope=document.createElement('textarea');scope.rows=4;scope.style.width='100%';scope.placeholder='Deliverables, formats, schedule, revisions, licensing and exclusions';scope.value=item.quote_scope||'';scope.setAttribute('aria-label','Quote scope');
const quoteSave=document.createElement('button');quoteSave.textContent='Save draft quote';quoteSave.addEventListener('click',async()=>{quoteSave.disabled=true;try{const dollars=Number(amount.value);if(!amount.value||!Number.isFinite(dollars)||dollars<0||!Number.isInteger(Math.round(dollars*100)*1))throw Error('Enter a valid dollar amount');await call('quote',{id:item.id,amount:Math.round(dollars*100),scope:scope.value});message.textContent='Internal quote saved. Not sent to customer.'}catch(e){message.textContent=e.message}finally{quoteSave.disabled=false}});quoteBox.append(amount,scope,quoteSave);article.append(quoteBox);
const mediaBox=document.createElement('section');const mediaTitle=document.createElement('h3');mediaTitle.textContent='Internal video preview and delivery references';mediaBox.append(mediaTitle);
const preview=document.createElement('input');preview.type='url';preview.placeholder='HTTPS preview URL';preview.value=item.preview_url||'';preview.style.width='100%';preview.setAttribute('aria-label','Preview video URL');
const delivery=document.createElement('input');delivery.type='url';delivery.placeholder='HTTPS delivery URL';delivery.value=item.delivery_url||'';delivery.style.width='100%';delivery.setAttribute('aria-label','Delivery video URL');
const mediaSave=document.createElement('button');mediaSave.textContent='Save internal media references';mediaSave.addEventListener('click',async()=>{mediaSave.disabled=true;try{await call('delivery',{id:item.id,preview:preview.value,delivery:delivery.value});message.textContent='Internal media references saved. No customer was notified.'}catch(e){message.textContent=e.message}finally{mediaSave.disabled=false}});mediaBox.append(preview,delivery,mediaSave);article.append(mediaBox);
list.append(article)}}catch(e){message.textContent=e.message}}
document.getElementById('refresh').addEventListener('click',load);document.getElementById('demo').addEventListener('click',async()=>{try{const result=await call('demo',{});await load();message.textContent=result.message}catch(e){message.textContent=e.message}});load();
</script></body></html>
