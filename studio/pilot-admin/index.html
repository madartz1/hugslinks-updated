<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUGS Studio · Pilot Review</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#102b45;background:#f1f6fa}*{box-sizing:border-box}body{margin:0}header{background:#102b45;color:#fff;padding:20px}header a{color:#b4e3ff}main{max-width:960px;margin:auto;padding:24px 18px}button,select{font:inherit;padding:9px;border:1px solid #c4d6e3;border-radius:8px}button{background:#087bbd;color:#fff;font-weight:700;cursor:pointer}article{background:#fff;border:1px solid #d9e5ed;border-radius:14px;padding:18px;margin:16px 0;overflow-wrap:anywhere}dt{font-weight:800;margin-top:12px}dd{margin:4px 0 0;white-space:pre-wrap}p{line-height:1.5}a{color:#087bbd}</style></head><body><header><a href="/studio/">← HL Studio</a> · Private pilot applications</header><main><h1>Managed production requests</h1><p>Preview-only admin review. Sign in with the configured HL Studio pilot administrator account. Do not share this page as a customer application link.</p><button id="refresh">Refresh requests</button><p id="message" role="status"></p><div id="list"></div></main><script>
const message=document.getElementById('message'),list=document.getElementById('list');
async function call(action,body){const response=await fetch('/.netlify/functions/hl-studio-pilot?action='+action,{credentials:'same-origin',...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});const data=await response.json();if(!response.ok)throw Error(data.error||'Unable to load');return data}
async function load(){message.textContent='Loading…';list.replaceChildren();try{const data=await call('list');message.textContent=data.requests.length+' applications';for(const item of data.requests){const article=document.createElement('article');const title=document.createElement('h2');title.textContent=item.business_name+' · '+item.contact_name;article.append(title);const small=document.createElement('p');small.textContent='Submitted '+new Date(item.created_at).toLocaleString()+' · '+item.service+' · '+item.duration+' seconds';article.append(small);for(const [label,value] of [['Email',item.email],['Business type',item.business_type],['Goal',item.objective],['Audience',item.audience],['Budget',item.budget],['Preferred date',item.deadline],['Notes',item.notes]]){if(!value)continue;const dl=document.createElement('dl'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;dl.append(dt,dd);article.append(dl)}if(item.assets_url){const a=document.createElement('a');a.href=item.assets_url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Open supplied asset link ↗';article.append(a)}const row=document.createElement('p');const label=document.createElement('label');label.textContent='Application status: ';const select=document.createElement('select');for(const value of ['new','reviewing','accepted','declined','delivered']){const opt=document.createElement('option');opt.value=value;opt.textContent=value;if(value===item.status)opt.selected=true;select.append(opt)}const save=document.createElement('button');save.textContent='Save status';save.addEventListener('click',async()=>{save.disabled=true;try{await call('status',{id:item.id,status:select.value});message.textContent='Saved status for '+item.business_name}catch(e){message.textContent=e.message}finally{save.disabled=false}});label.append(select);row.append(label,document.createTextNode(' '),save);article.append(row);list.append(article)}}catch(e){message.textContent=e.message}}
document.getElementById('refresh').addEventListener('click',load);load();
</script></body></html>
