<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anniversary HUGS Card</title><style>body{margin:0;background:#071f3b;color:white;font:19px system-ui;text-align:center}main{max-width:650px;margin:35px auto;padding:24px}section{background:#fff1f4;color:#071f3b;padding:35px 22px;border-radius:25px;min-height:260px}h1{font-size:clamp(28px,6vw,46px)}p{line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}button{margin:25px;background:#f2b84b;color:#071f3b;border:0;border-radius:40px;padding:15px 25px;font:inherit}</style></head><body><main><div>HUGSLinks · Anniversary Card</div><section id="page"><h1>Opening your HUG…</h1></section><button id="next" hidden>Next page</button></main><script>const page=document.querySelector('#page'),next=document.querySelector('#next');let index=0,card;function render(){page.replaceChildren();const title=document.createElement('h1'),p=document.createElement('p');if(index===0){title.textContent='Happy Anniversary!';p.textContent='A special HUG is waiting for '+card.recipient+'.'}else if(index===1){title.textContent='For '+card.recipient;p.textContent=card.message}else{title.textContent='With love';p.textContent='From '+card.sender+' · Give a Hug. Get a Hug.'}page.append(title,p);next.textContent=index===2?'Start again':'Next page'}next.onclick=()=>{index=(index+1)%3;render()};(async()=>{try{const id=new URLSearchParams(location.search).get('id');const response=await fetch('/.netlify/functions/anniversary-test-fulfillment?id='+encodeURIComponent(id||''));const data=await response.json();if(!response.ok)throw Error(data.error);card=data.card;render();next.hidden=false}catch(e){page.textContent=e.message||'Unable to load card'}})();</script></body></html>
