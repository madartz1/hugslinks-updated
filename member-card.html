<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My HUGS Original Card | HUGSLinks</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="styles.css"><style>
body{margin:0;background:radial-gradient(circle at 50% 20%,#123b65,#020914 60%);color:#fff}.wrap{min-height:100vh;display:grid;place-items:center;padding:34px 16px}.holder{width:min(900px,100%)}.member-card{position:relative;overflow:hidden;width:100%;aspect-ratio:1.586;border-radius:32px;padding:clamp(22px,5vw,48px);border:3px solid #d69a32;background:radial-gradient(circle at 78% 28%,rgba(47,158,231,.36),transparent 34%),linear-gradient(135deg,#030b16,#092e55 62%,#020914);box-shadow:0 30px 80px #000,0 0 34px rgba(47,158,231,.28);display:flex;flex-direction:column;justify-content:space-between}.member-card:after{content:"";position:absolute;inset:-50%;background:linear-gradient(110deg,transparent 43%,rgba(255,255,255,.12) 49%,transparent 55%);transform:rotate(8deg);pointer-events:none}.wordmark{font-size:clamp(1.8rem,5vw,3.8rem);font-weight:950}.wordmark span,.number{color:#f2b84b}.mission{font-size:.7rem;letter-spacing:.16em;color:#a9c8e1}.member-title{letter-spacing:.18em;font-weight:900;color:#8bdcff;font-size:clamp(.65rem,1.7vw,1rem)}.number{font-size:clamp(3rem,12vw,7.8rem);font-weight:950;line-height:.9}.name{margin-top:9px;font-size:clamp(1rem,3vw,1.5rem);font-weight:850}.tag{font-style:italic;font-size:clamp(1rem,2.5vw,1.5rem)}.status{text-align:center;color:#a9c0d3;margin:18px}.error{color:#ffd36d}.vault-link{display:none;text-align:center;margin-top:18px;color:#72cfff;font-weight:900}
</style></head><body><main class="wrap"><div class="holder"><section class="member-card" id="card" hidden><div><div class="wordmark">Hugs<span>Links</span></div><div class="mission">HELP UNDER GOOD SERVICE</div></div><div><div class="member-title">HUGS ORIGINAL • FOUNDING MEMBER</div><div class="number" id="number">---/333</div><div class="name" id="name"></div></div><div class="tag">Give a Hug. Get a Hug.</div></section><p class="status" id="status">Verifying your HUGS Original membership…</p><a class="vault-link" id="vaultLink" href="member-vault.html">Return to Members Vault</a></div></main><script>
(async()=>{const status=document.getElementById("status"),token=new URLSearchParams(location.search).get("token");if(!token){status.innerHTML='<span class="error">A private member-card link is required.</span>';return}try{const response=await fetch("/.netlify/functions/member-card?token="+encodeURIComponent(token),{cache:"no-store"}),data=await response.json();if(!data.ok)throw new Error();document.getElementById("number").textContent=data.member.displayNumber;document.getElementById("name").textContent=data.member.name;document.getElementById("card").hidden=false;status.textContent="ACCESS GRANTED • MEMBERS VAULT";const v=document.getElementById("vaultLink");v.href="member-vault.html?token="+encodeURIComponent(token);v.style.display="block"}catch(e){status.innerHTML='<span class="error">We could not verify this member card.</span>'}})();
</script></body></html>
