<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Your HUG | HUGSLinks</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #0f2742;
    }

    .delivery-wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px 70px;
    }

    .delivery-card {
      background: #ffffff;
      border-radius: 22px;
      padding: 28px 22px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    .delivery-card h1 {
      margin-top: 0;
      font-size: 32px;
      line-height: 1.2;
    }

    .intro {
      font-size: 17px;
      line-height: 1.6;
      color: #42556b;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 15px;
      border: 1px solid #cfd8e3;
      border-radius: 12px;
      font-size: 16px;
    }

    .primary-btn,
    .action-btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      border: none;
      border-radius: 999px;
      padding: 15px 20px;
      margin-top: 18px;
      font-size: 17px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .primary-btn {
      background: #0f2742;
      color: white;
    }

    .action-btn {
      background: #e9eef5;
      color: #0f2742;
    }

    .status {
      display: none;
      margin-top: 20px;
      padding: 14px;
      border-radius: 12px;
      background: #eef3f8;
      line-height: 1.5;
      word-break: break-word;
    }

    .details {
      display: none;
      margin-top: 20px;
      line-height: 1.7;
      color: #42556b;
    }

    .video-box {
      display: none;
      margin-top: 28px;
    }

    video {
      width: 100%;
      border-radius: 16px;
      background: black;
    }

    .button-group {
      display: none;
      margin-top: 20px;
    }

    .small-note {
      display: none;
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
      color: #6b7b8d;
    }
  </style>
</head>


<body>

  <header class="topbar">

    <nav class="nav">

      <a
        class="brand"
        href="index.html"
      >
        Hugslinks
      </a>

      <div class="seal">

        <img
          src="assets/HUGS_Header_Logo_Transparent.png"
          alt="HUGS logo"
        >

      </div>

      <button
        class="menu"
        type="button"
        aria-expanded="false"
        aria-label="Open navigation menu"
      >
        Menu
      </button>

      <div class="navlinks">

        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="hugs-cards.html">HUGS Cards</a>
        <a href="art-community.html">Art</a>
        <a href="food-support.html">Food</a>
        <a href="housing-help.html">Housing</a>
        <a href="business-services.html">Business</a>
        <a href="help-app.html">Help App</a>
        <a href="resources.html">Resources</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>

      </div>

    </nav>

  </header>


  <main class="delivery-wrap">

    <div class="delivery-card">

      <h1>
        Your HUG is ready 💙
      </h1>

      <p class="intro">
        Enter your order number and the
        purchase email from your HUGSLinks
        delivery email.
      </p>


      <label for="orderId">
        Order number
      </label>

      <input
        id="orderId"
        type="text"
        autocomplete="off"
      >


      <label for="email">
        Purchase email
      </label>

      <input
        id="email"
        type="email"
        autocomplete="email"
      >


      <button
        id="openButton"
        class="primary-btn"
        type="button"
      >
        Open My HUG
      </button>


      <div
        id="status"
        class="status"
      ></div>


      <div
        id="details"
        class="details"
      ></div>


      <div
        id="videoBox"
        class="video-box"
      >

        <video
          id="hugVideo"
          controls
          playsinline
          preload="metadata"
        ></video>

      </div>


      <div
        id="buttonGroup"
        class="button-group"
      >

        <button
          id="fullscreenButton"
          class="action-btn"
          type="button"
        >
          Watch Full Screen
        </button>


        <a
          id="downloadButton"
          class="action-btn"
          href="#"
        >
          Download Your HUG
        </a>


        <button
          id="shareButton"
          class="action-btn"
          type="button"
        >
          Share Your HUG
        </button>

      </div>


      <p
        id="storageNote"
        class="small-note"
      >
        Your HUG is stored permanently
        for delivery.
      </p>

    </div>

  </main>


  <script src="script.js"></script>


  <script>

    const orderInput =
      document.getElementById("orderId");

    const emailInput =
      document.getElementById("email");

    const openButton =
      document.getElementById("openButton");

    const statusBox =
      document.getElementById("status");

    const details =
      document.getElementById("details");

    const videoBox =
      document.getElementById("videoBox");

    const video =
      document.getElementById("hugVideo");

    const buttonGroup =
      document.getElementById("buttonGroup");

    const fullscreenButton =
      document.getElementById("fullscreenButton");

    const downloadButton =
      document.getElementById("downloadButton");

    const shareButton =
      document.getElementById("shareButton");

    const storageNote =
      document.getElementById("storageNote");


    let currentVideoUrl = "";
    let currentDownloadUrl = "";


    function showStatus(
      message,
      isError = false
    ) {

      statusBox.style.display =
        "block";

      statusBox.textContent =
        message;

      statusBox.style.background =
        isError
          ? "#fff0f0"
          : "#eef3f8";

      statusBox.style.color =
        isError
          ? "#8a1f1f"
          : "#0f2742";
    }


    function escapeHtml(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function resetDelivery() {

      details.style.display =
        "none";

      videoBox.style.display =
        "none";

      buttonGroup.style.display =
        "none";

      storageNote.style.display =
        "none";

      video.removeAttribute("src");

      video.load();

      currentVideoUrl = "";
      currentDownloadUrl = "";
    }


    openButton.addEventListener(
      "click",
      async function () {

        resetDelivery();


        const orderId =
          orderInput.value.trim();

        const email =
          emailInput.value.trim();


        if (!orderId || !email) {

          showStatus(
            "Enter your order number and purchase email.",
            true
          );

          return;
        }


        openButton.disabled =
          true;

        openButton.textContent =
          "Opening...";


        showStatus(
          "Finding your HUG..."
        );


        try {

          const response =
            await fetch(
              "/.netlify/functions/get-hug-delivery",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  order_id: orderId,
                  email: email
                })
              }
            );


          const text =
            await response.text();


          let result;


          try {

            result =
              JSON.parse(text);

          } catch {

            throw new Error(
              text ||
              "The HUG delivery service returned an invalid response."
            );
          }


          if (
            response.status === 202
          ) {

            showStatus(
              result.message ||
              "Your HUG is still being prepared."
            );

            return;
          }


          if (
            !response.ok ||
            !result.success
          ) {

            throw new Error(
              result.details ||
              result.error ||
              "Unable to open this HUG."
            );
          }


          currentVideoUrl =
            result.video_url || "";


          currentDownloadUrl =
            result.download_url || "";


          if (!currentVideoUrl) {

            throw new Error(
              "The HUG video link is unavailable."
            );
          }


          video.src =
            currentVideoUrl;

          videoBox.style.display =
            "block";


          if (currentDownloadUrl) {

            downloadButton.href =
              currentDownloadUrl;

            downloadButton.style.display =
              "block";

          } else {

            downloadButton.style.display =
              "none";
          }


          let detailText = "";


          if (result.recipient_name) {

            detailText +=
              "<strong>For " +
              escapeHtml(
                result.recipient_name
              ) +
              "</strong>";
          }


          if (result.occasion) {

            detailText +=
              "<br>Occasion: " +
              escapeHtml(
                result.occasion
              );
          }


          if (result.sender_name) {

            detailText +=
              "<br>From: " +
              escapeHtml(
                result.sender_name
              );
          }


          details.innerHTML =
            detailText;


          details.style.display =
            "block";

          buttonGroup.style.display =
            "block";


          if (
            result.video_source === "r2"
          ) {

            storageNote.style.display =
              "block";
          }


          showStatus(
            "Your HUG is ready."
          );


        } catch (error) {

          showStatus(
            error.message ||
            "Unable to open your HUG.",
            true
          );

        } finally {

          openButton.disabled =
            false;

          openButton.textContent =
            "Open My HUG";
        }
      }
    );


    fullscreenButton.addEventListener(
      "click",
      function () {

        try {

          if (
            video.webkitEnterFullscreen
          ) {

            video.webkitEnterFullscreen();

          } else if (
            video.requestFullscreen
          ) {

            video.requestFullscreen();
          }

        } catch (error) {

          console.error(
            "Fullscreen error:",
            error
          );
        }
      }
    );


    shareButton.addEventListener(
      "click",
      async function () {

        if (!currentVideoUrl) {
          return;
        }


        try {

          if (navigator.share) {

            await navigator.share({
              title:
                "My HUGSLinks HUG",

              text:
                "A personalized HUG from HUGSLinks.",

              url:
                currentVideoUrl
            });

          } else {

            await navigator.clipboard
              .writeText(
                currentVideoUrl
              );


            showStatus(
              "HUG link copied."
            );
          }

        } catch (error) {

          if (
            error.name !== "AbortError"
          ) {

            console.error(
              "Share error:",
              error
            );
          }
        }
      }
    );

  </script>

</body>

</html>
