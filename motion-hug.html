<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion Story HUG | HUGSLinks</title><meta name="description" content="Preview or open an interactive HUGSLinks Motion Story HUG."><style>
:root{--navy:#071f3b;--blue:#168dff;--gold:#f1b84b;--cream:#fff7ef}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#23374d;background:radial-gradient(circle at 50% 0,#dff3ff,#fff7ef 55%,#fff);min-height:100vh}a{color:inherit}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 5vw;background:var(--navy);color:#fff}.brand{font-weight:900;text-decoration:none;font-size:1.25rem}.back{font-weight:800;color:#9fd8ff}main{width:min(920px,calc(100% - 28px));margin:34px auto 70px;text-align:center}.eyebrow{color:var(--blue);font-weight:900;letter-spacing:.15em;text-transform:uppercase;font-size:.76rem}h1{font-size:clamp(2.4rem,8vw,4.9rem);line-height:.95;color:var(--navy);margin:10px 0}.lead{font-size:1.08rem;line-height:1.65;max-width:720px;margin:0 auto 22px;color:#587086}.hero{width:min(100%,560px);max-height:650px;object-fit:contain;border-radius:24px;box-shadow:0 22px 60px rgba(7,31,59,.22);background:#fff;animation:rise .7s ease both,float 5s ease-in-out infinite}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translateY(-6px)}}.story{display:flex;gap:13px;overflow:auto;scroll-snap-type:x mandatory;padding:15px;margin:24px auto;border-radius:20px;background:rgba(255,255,255,.76);box-shadow:0 12px 36px rgba(7,31,59,.1)}.story figure{margin:0;flex:0 0 210px;scroll-snap-align:start;position:relative}.story img{width:210px;height:270px;object-fit:cover;border-radius:16px}.story figcaption{font-weight:800;padding:8px}.locked{filter:blur(7px);opacity:.55}.lock-label{position:absolute;inset:90px 22px auto;background:rgba(7,31,59,.9);color:#fff;padding:11px;border-radius:12px;font-weight:900}.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:22px 0}.btn{border:0;border-radius:999px;padding:15px 22px;font-size:1rem;font-weight:900;cursor:pointer;text-decoration:none}.primary{background:var(--navy);color:#fff}.gold{background:linear-gradient(135deg,var(--gold),#f8d77e);color:#17212c}.outline{background:#fff;border:2px solid var(--navy);color:var(--navy)}.price{font-size:1.4rem;font-weight:900;color:var(--navy)}.notice{padding:14px;border-radius:14px;background:#fff4ce;color:#594308;margin:16px auto;max-width:650px}.status{min-height:24px;font-weight:800}dialog{border:0;padding:0;border-radius:25px;width:min(94vw,900px);background:var(--navy);color:#fff;box-shadow:0 30px 90px rgba(0,0,0,.55)}dialog::backdrop{background:rgba(2,10,23,.84);backdrop-filter:blur(7px)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}.close{width:42px;height:42px;border:0;border-radius:50%;font-size:1.5rem}.player{position:relative;padding:14px 64px 28px}.frame{position:relative;border-radius:18px;overflow:hidden;background:#fff;min-height:320px;display:grid;place-items:center}.frame img{width:100%;max-height:68vh;object-fit:contain}.caption{position:absolute;left:12px;right:12px;bottom:12px;padding:10px;background:rgba(0,0,0,.58);border-radius:12px}.nav{position:absolute;top:48%;width:46px;height:46px;border:0;border-radius:50%;font-size:1.7rem;z-index:3}.prev{left:9px}.next{right:9px}.dots{display:flex;justify-content:center;gap:8px;margin:12px}.dot{width:11px;height:11px;border:0;border-radius:50%;background:#71849a}.dot.active{background:var(--gold)}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.controls button{padding:10px 14px;border:0;border-radius:10px;font-weight:800}.hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden}.heart{position:absolute;bottom:-20px;animation:heart linear forwards;opacity:.8}@keyframes heart{to{transform:translateY(-100vh) scale(1.5);opacity:0}}@media(max-width:600px){.player{padding:8px 45px 22px}.story figure,.story img{width:170px}.story img{height:220px}.top{align-items:flex-start;flex-direction:column}}</style></head><body>
<header class="top"><a class="brand" href="/">HUGSLinks</a><a class="back" href="/hugs-cards">← HUGS Cards</a></header><main><div class="eyebrow" id="modeLabel">Motion Story HUG</div><h1 id="title">Opening your HUG…</h1><p class="lead" id="description"></p><img class="hero" id="cover" alt="" hidden><div id="cancelled" class="notice" hidden>Checkout was canceled. Your card preview is still here whenever you are ready.</div><div class="story" id="story" hidden></div><div class="price" id="price"></div><p class="status" id="status" role="status"></p><div class="actions"><button class="btn primary" id="previewBtn" hidden>Preview Motion Card</button><button class="btn gold" id="buyBtn" hidden>Unlock Full Card</button><button class="btn outline" id="shareBtn" hidden>Copy Recipient Link</button></div></main>
<dialog id="player"><div class="modal-head"><strong id="playerTitle">Your HUG</strong><button class="close" id="closeBtn" aria-label="Close">×</button></div><div class="player"><div class="hearts" id="hearts"></div><button class="nav prev" id="prevBtn">‹</button><div class="frame"><img id="slide" alt=""><div class="caption" id="caption"></div></div><button class="nav next" id="nextBtn">›</button><div class="dots" id="dots"></div><div class="controls"><button id="playBtn">Pause</button><button id="musicBtn">Play Music</button><button id="stopMusicBtn">Stop Music</button></div></div></dialog><audio id="music" loop playsinline></audio>
<script>
const q=new URLSearchParams(location.search),slug=q.get("card"),order=q.get("order"),access=q.get("access"),sessionId=q.get("session_id"),el=id=>document.getElementById(id);let card=null,full=false,current=0,timer=null,heartTimer=null;const money=c=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format((c||0)/100);
async function api(url,options){const r=await fetch(url,{cache:"no-store",...options}),d=await r.json();if(!r.ok)throw Object.assign(Error(d.error||"Request failed"),{pending:d.pending});return d}
async function load(){if(q.get("checkout")==="cancelled")el("cancelled").hidden=false;try{if(order&&access){el("modeLabel").textContent="Paid Motion Story HUG";let attempts=0;while(true){try{const d=await api("/.netlify/functions/motion-hug-access",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({order_id:order,access_key:access,session_id:sessionId})});card=d.card;full=true;el("shareBtn").dataset.path=d.share_path;break}catch(e){if(!e.pending||attempts++>5)throw e;el("status").textContent="Confirming payment…";await new Promise(r=>setTimeout(r,1800))}}}else{card=(await api("/.netlify/functions/motion-hug-catalog?slug="+encodeURIComponent(slug||"heres-a-hug-original"))).card}render()}catch(e){el("title").textContent="This HUG could not open";el("status").textContent=e.message}}
function render(){document.title=card.title+" | HUGSLinks";el("title").textContent=card.title;el("description").textContent=card.description||card.subtitle||"";el("cover").src=card.cover_url;el("cover").alt=card.title;el("cover").hidden=false;el("price").textContent=full?"Full card unlocked":money(card.price_cents)+" · Digital Motion Story";const visible=card.scenes;el("story").replaceChildren();visible.forEach(s=>{const f=document.createElement("figure"),i=document.createElement("img"),c=document.createElement("figcaption");i.src=s.image_url;i.alt=s.caption;c.textContent=s.caption;f.append(i,c);el("story").append(f)});const locked=Math.max(0,(card.total_scene_count||card.scenes.length)-visible.length);if(!full&&locked){const f=document.createElement("figure"),i=document.createElement("img"),l=document.createElement("div");i.src=card.cover_url;i.alt="Locked scenes";i.className="locked";l.className="lock-label";l.textContent=locked+" more scenes";f.append(i,l);el("story").append(f)}el("story").hidden=false;el("previewBtn").hidden=false;el("buyBtn").hidden=full;el("shareBtn").hidden=!full;el("buyBtn").textContent="Unlock Full Card — "+money(card.price_cents);el("status").textContent=full?"Ready to share with someone special.":"Preview before purchasing."}
function scenes(){return full?card.scenes:card.scenes.slice(0,Math.max(1,card.preview_scene_count||3))}function show(i){const s=scenes();current=(i+s.length)%s.length;el("slide").src=s[current].image_url;el("slide").alt=s[current].caption;el("caption").textContent=s[current].caption;[...el("dots").children].forEach((d,n)=>d.classList.toggle("active",n===current))}
function start(){stop();const s=scenes(),next=()=>{show(current+1);timer=setTimeout(next,s[current]?.duration_ms||card.scene_interval_ms||3600)};timer=setTimeout(next,s[current]?.duration_ms||card.scene_interval_ms||3600)}function stop(){clearTimeout(timer);timer=null}
function openPlayer(){el("dots").replaceChildren();scenes().forEach((_,i)=>{const b=document.createElement("button");b.className="dot";b.onclick=()=>{show(i);start()};el("dots").append(b)});el("playerTitle").textContent=card.title;show(0);el("player").showModal();start();if(card.hearts_enabled)heartTimer=setInterval(spawnHeart,700);if(card.audio_url&&!el("music").src)el("music").src=card.audio_url}function closePlayer(){el("player").close();stop();clearInterval(heartTimer);el("hearts").replaceChildren();el("music").pause()}
function spawnHeart(){const h=document.createElement("span");h.className="heart";h.textContent=Math.random()>.5?"❤":"💙";h.style.left=Math.random()*100+"%";h.style.fontSize=14+Math.random()*20+"px";h.style.animationDuration=5+Math.random()*5+"s";el("hearts").append(h);setTimeout(()=>h.remove(),10500)}
el("previewBtn").onclick=openPlayer;el("closeBtn").onclick=closePlayer;el("prevBtn").onclick=()=>{show(current-1);start()};el("nextBtn").onclick=()=>{show(current+1);start()};el("playBtn").onclick=()=>{if(timer){stop();el("playBtn").textContent="Play"}else{start();el("playBtn").textContent="Pause"}};el("musicBtn").onclick=async()=>{try{await el("music").play();el("musicBtn").textContent="Music Playing ✓"}catch{el("status").textContent="Turn off silent mode, then tap Play Music again."}};el("stopMusicBtn").onclick=()=>{el("music").pause();el("music").currentTime=0;el("musicBtn").textContent="Play Music"};el("buyBtn").onclick=async()=>{el("buyBtn").disabled=true;el("status").textContent="Opening secure checkout…";try{const d=await api("/.netlify/functions/create-motion-hug-checkout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({card_slug:card.slug})});location.assign(d.checkout_url)}catch(e){el("status").textContent=e.message;el("buyBtn").disabled=false}};el("shareBtn").onclick=async()=>{const url=new URL(el("shareBtn").dataset.path,location.origin).href;try{await navigator.clipboard.writeText(url);el("status").textContent="Recipient link copied."}catch{prompt("Copy this recipient link:",url)}};el("player").addEventListener("click",e=>{if(e.target===el("player"))closePlayer()});load();
</script></body></html>
